services:
  - type: web
    name: conformalized-brain-tumor-agent
    env: python
    region: oregon
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install --upgrade pip && pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
